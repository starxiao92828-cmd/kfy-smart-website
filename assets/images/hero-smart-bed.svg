<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" role="img" aria-labelledby="title desc">
  <title id="title">KFY SMART adjustable smart bed hero visual</title>
  <desc id="desc">A futuristic adjustable bed with blue glow and sleep data panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09203d"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop stop-color="#66d8ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#2f73ff" stop-opacity=".15"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="980" height="680" rx="44" fill="url(#bg)" opacity=".78"/>
  <g stroke="#224a7a" stroke-width="1" opacity=".42">
    <path d="M70 110h830M70 210h830M70 310h830M70 410h830M70 510h830"/>
    <path d="M120 70v540M240 70v540M360 70v540M480 70v540M600 70v540M720 70v540M840 70v540"/>
  </g>
  <circle cx="560" cy="360" r="250" fill="none" stroke="#59c9ff" stroke-width="2" opacity=".25"/>
  <path d="M110 492C285 438 400 438 572 486c131 36 232 19 330-60" fill="none" stroke="url(#glow)" stroke-width="16" opacity=".35" filter="url(#softGlow)"/>
  <g transform="translate(130 230)" filter="url(#shadow)">
    <ellipse cx="360" cy="262" rx="315" ry="56" fill="#0a1322" opacity=".72"/>
    <rect x="112" y="292" width="480" height="32" rx="14" fill="#101b2c"/>
    <rect x="102" y="254" width="520" height="56" rx="18" fill="#122947"/>
    <rect x="78" y="228" width="550" height="28" rx="14" fill="#2578e8"/>
    <path d="M112 220C178 110 270 70 377 90c62 11 130 56 190 136" fill="none" stroke="#eef8ff" stroke-width="62" stroke-linecap="round"/>
    <path d="M120 213C187 110 268 87 365 105c65 12 123 54 177 118" fill="none" stroke="#ccecff" stroke-width="48" stroke-linecap="round" opacity=".94"/>
    <path d="M70 236l-34 96" stroke="#77dafa" stroke-width="18" stroke-linecap="round"/>
    <rect x="280" y="250" width="88" height="24" rx="12" fill="#0b1b33"/>
    <rect x="510" y="242" width="84" height="20" rx="10" fill="#0b1b33"/>
    <rect x="256" y="306" width="250" height="30" rx="15" fill="#081223" stroke="#2f83d7" opacity=".8"/>
    <rect x="120" y="327" width="430" height="11" rx="5" fill="#39a6ff" opacity=".55" filter="url(#softGlow)"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1.2" fill="#a7e9ff">
    <g transform="translate(62 122)">
      <rect width="210" height="100" rx="22" fill="#09182b" stroke="#5bd8ff" opacity=".9"/>
      <text x="24" y="38" font-size="15">APP CONTROL</text>
      <text x="24" y="70" font-size="17" fill="#fff" font-weight="500">Remote + App</text>
    </g>
    <g transform="translate(692 102)">
      <rect width="220" height="118" rx="22" fill="#09182b" stroke="#5bd8ff" opacity=".9"/>
      <text x="24" y="40" font-size="15">SLEEP SCORE</text>
      <text x="24" y="88" font-size="50" fill="#fff">92</text>
    </g>
    <g transform="translate(660 442)">
      <rect width="240" height="100" rx="22" fill="#09182b" stroke="#5bd8ff" opacity=".9"/>
      <text x="24" y="38" font-size="15">SLEEP MONITORING</text>
      <text x="24" y="70" font-size="17" fill="#fff" font-weight="500">Trend insights</text>
    </g>
    <g transform="translate(82 500)">
      <rect width="220" height="100" rx="22" fill="#09182b" stroke="#5bd8ff" opacity=".9"/>
      <text x="24" y="38" font-size="15">SMART COMFORT</text>
      <text x="24" y="70" font-size="17" fill="#fff" font-weight="500">Zero gravity</text>
    </g>
  </g>
  <g stroke="#6ddaff" stroke-width="2" opacity=".55">
    <path d="M272 222l78 98"/><circle cx="272" cy="222" r="5" fill="#6ddaff"/>
    <path d="M720 218l-70 142"/><circle cx="720" cy="218" r="5" fill="#6ddaff"/>
    <path d="M646 454l-78-75"/><circle cx="646" cy="454" r="5" fill="#6ddaff"/>
  </g>
</svg>
